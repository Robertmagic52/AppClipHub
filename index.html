<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Aura Hub</title>
  <style>
    :root {
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --bg: #0d0d0d;
      --tile: #161616;
      --tile-active: #242424;
      --card: #1c1c1e;
      --input: #2c2c2e;
      --border: #3a3a3c;
      --accent: #0a84ff;
      --green: #30d158;
      --danger: #ff453a;
      --muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: calc(var(--st) + 20px) 20px calc(var(--sb) + 96px);
      max-width: 580px;
      margin: 0 auto;
    }

    /* Top Segmented Tab Switcher */
    .tabs-header {
      position: sticky;
      top: calc(var(--st) + 10px);
      z-index: 40;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(28, 28, 30, 0.88);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 24px;
    }

    .tab-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .tab-btn.active {
      background: #2c2c2e;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* TAB 1: iControl-Style Launch Tiles */
    .menu-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-tile {
      background-color: var(--tile);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px 14px 26px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.2px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .menu-tile:active {
      background-color: var(--tile-active);
      transform: scale(0.99);
    }

    .tile-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
      padding-right: 12px;
    }

    .tile-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-sub {
      font-size: 12px;
      font-weight: 400;
      color: #636366;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-arrow {
      color: #48484a;
      font-size: 20px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 48px 20px;
      background: var(--tile);
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    /* TAB 2: Editor UI */
    .section-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 6px 0 10px 4px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sync-pill {
      font-size: 11px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      color: var(--green);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .sync-pill.syncing {
      color: #ffd60a;
    }
    .sync-pill.syncing .sync-dot {
      background: #ffd60a;
    }

    .card {
      background-color: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-num {
      font-size: 11px;
      font-weight: 700;
      color: #636366;
      letter-spacing: 0.4px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: #2c2c2e;
      color: #ebebf5;
      border: none;
      width: 30px;
      height: 28px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .btn-delete {
      background: #3a1515;
      color: var(--danger);
      border: none;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      padding: 12px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    input[type="text"]:focus, input[type="url"]:focus {
      border-color: var(--accent);
    }

    .btn-add {
      width: 100%;
      background: var(--card);
      color: var(--accent);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      font-family: inherit;
    }

    .btn-save {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      font-family: inherit;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn-save:active {
      transform: scale(0.99);
      opacity: 0.9;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--sb) + 22px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Segmented Tabs -->
  <div class="tabs-header">
    <button type="button" class="tab-btn active" id="tabLaunchBtn" onclick="switchTab('launch')">App Clips</button>
    <button type="button" class="tab-btn" id="tabEditBtn" onclick="switchTab('edit')">Edit Clips</button>
  </div>

  <!-- TAB 1: Select & Launch App Clip Directly in Aura Browser -->
  <div class="tab-pane active" id="paneLaunch">
    <div class="menu-container" id="menuContainer"></div>
  </div>

  <!-- TAB 2: Edit / Add / Reorder App Clips (Synced Across Devices) -->
  <div class="tab-pane" id="paneEdit">
    <div class="section-label">
      <span>Aura Browser App Clips</span>
      <span class="sync-pill" id="syncPill"><span class="sync-dot"></span><span id="syncText">Cloud Synced</span></span>
    </div>
    <div id="linksList"></div>

    <button class="btn-add" type="button" onclick="addLink()">+ Add App Clip</button>
    <button class="btn-save" type="button" onclick="saveAndSwitch()">Save & Sync Across Devices</button>
  </div>

  <div class="toast" id="toast">Saved & Synced!</div>

  <script>
    // Connects to your existing Render backend so changes sync across all devices automatically!
    const BACKEND_URL = 'https://smartcalc-backend-el0f.onrender.com';
    const STORAGE_KEY = 'aura_hub_clips_v2';

    const DEFAULT_CLIPS = [
      { name: 'iControl Web App', url: 'https://icontrol-magic.onrender.com/', openInSafari: false },
      { name: 'Magic Remote Dashboard', url: 'https://smartcalc-backend-el0f.onrender.com/', openInSafari: false }
    ];

    // links holds the Aura Hub clips [{ name, url, openInSafari }]
    let links = [];
    // preservedSpecialSites keeps built-in items like "dice" intact on the backend for Stopwatch/Calculator
    let preservedSpecialSites = [
      { name: 'Built-in 3D Dice Roller', url: 'dice', openInSafari: false }
    ];

    function normalizeUrl(raw) {
      if (!raw) return '';
      const s = raw.trim();
      if (!s) return '';
      if (s.toLowerCase() === 'dice') return 'dice';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return s;
      return 'https://' + s;
    }

    function setSyncStatus(state, text) {
      const pill = document.getElementById('syncPill');
      const txt = document.getElementById('syncText');
      if (!pill || !txt) return;
      pill.classList.toggle('syncing', state === 'syncing');
      txt.textContent = text;
    }

    function loadLocalCache() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) {
            links = parsed.map(x => ({
              name: x.name || x.title || 'App Clip',
              url: x.url || 'https://',
              openInSafari: !!x.openInSafari
            }));
            return;
          }
        }
      } catch (e) {}
      links = JSON.parse(JSON.stringify(DEFAULT_CLIPS));
    }

    function getDeletedUrls() {
      try {
        const raw = localStorage.getItem('aurahub.deleted_sites');
        if (raw) return new Set(JSON.parse(raw));
      } catch (e) {}
      return new Set();
    }
    function addDeletedUrl(u) {
      try {
        const set = getDeletedUrls();
        set.add(normalizeUrl(u));
        localStorage.setItem('aurahub.deleted_sites', JSON.stringify(Array.from(set)));
      } catch (e) {}
    }
    function unmarkDeletedUrl(u) {
      try {
        const set = getDeletedUrls();
        const clean = normalizeUrl(u);
        if (set.has(clean)) {
          set.delete(clean);
          localStorage.setItem('aurahub.deleted_sites', JSON.stringify(Array.from(set)));
        }
      } catch (e) {}
    }

    function saveLocalCache() {
      try {
        links.forEach(l => { if (l && l.url) unmarkDeletedUrl(l.url); });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
      } catch (e) {}
    }

    // Fetch latest list from Render backend so edits on any device show up everywhere
    async function pullFromCloud() {
      setSyncStatus('syncing', 'Syncing...');
      try {
        const res = await fetch(BACKEND_URL + '/api/sites?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && Array.isArray(data.savedSites) && data.savedSites.length) {
          const special = [];
          const remoteClips = [];
          const deleted = getDeletedUrls();
          data.savedSites.forEach(s => {
            if (!s || !s.url) return;
            const u = normalizeUrl(s.url);
            if (!u || deleted.has(u)) return;
            if (u === 'dice') {
              special.push(s);
            } else {
              remoteClips.push({
                name: s.name || s.url,
                url: u,
                openInSafari: !!s.openInSafari
              });
            }
          });
          if (special.length) preservedSpecialSites = special;

          // Smart merge: retain local additions if backend rebooted or wiped
          const map = new Map();
          remoteClips.forEach(c => map.set(c.url, c));
          let hadLocalAdditions = false;
          (links || []).forEach(local => {
            if (!local || !local.url) return;
            const u = normalizeUrl(local.url);
            if (!u || u === 'https://' || deleted.has(u)) return;
            if (!map.has(u)) {
              map.set(u, { name: local.name || u, url: u, openInSafari: !!local.openInSafari });
              hadLocalAdditions = true;
            }
          });

          const merged = Array.from(map.values());
          if (merged.length) {
            links = merged;
            saveLocalCache();
            renderLaunchTiles();
            if (document.getElementById('paneEdit').classList.contains('active')) {
              renderEditor();
            }
          }
          if (hadLocalAdditions) {
            pushToCloud();
          }
        }
        setSyncStatus('ok', 'Cloud Synced');
      } catch (err) {
        setSyncStatus('ok', 'Offline Cache');
      }
    }

    // Push updated list to Render backend so all other devices receive it
    async function pushToCloud() {
      setSyncStatus('syncing', 'Saving to Cloud...');
      saveLocalCache();
      const combined = [
        ...preservedSpecialSites,
        ...links
          .filter(x => x && x.url && x.url.trim() && x.url.trim() !== 'https://')
          .map(x => ({
            name: (x.name || x.url).trim(),
            url: normalizeUrl(x.url),
            openInSafari: !!x.openInSafari
          }))
      ];
      try {
        const res = await fetch(BACKEND_URL + '/api/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ savedSites: combined })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setSyncStatus('ok', 'Cloud Synced');
        return true;
      } catch (err) {
        setSyncStatus('ok', 'Saved Locally');
        return false;
      }
    }

    function switchTab(tab) {
      if (tab === 'launch') {
        if (document.getElementById('paneEdit').classList.contains('active')) {
          syncInputs();
          pushToCloud();
        }
        renderLaunchTiles();
      } else {
        renderEditor();
      }
      document.getElementById('tabLaunchBtn').classList.toggle('active', tab === 'launch');
      document.getElementById('tabEditBtn').classList.toggle('active', tab === 'edit');
      document.getElementById('paneLaunch').classList.toggle('active', tab === 'launch');
      document.getElementById('paneEdit').classList.toggle('active', tab === 'edit');
    }

    // --- TAB 1: RENDER LAUNCH TILES (Opens Directly in Aura Browser) ---
    function renderLaunchTiles() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      const validLinks = links.filter(item => item && (item.name || item.url));
      if (validLinks.length === 0) {
        container.innerHTML = `<div class="empty-state">No App Clips added yet.<br>Tap <b>Edit Clips</b> above to add your first web app.</div>`;
        return;
      }

      validLinks.forEach(item => {
        const destUrl = normalizeUrl(item.url);
        const tile = document.createElement('a');
        tile.className = 'menu-tile';
        tile.href = destUrl || '#';

        const info = document.createElement('div');
        info.className = 'tile-info';

        const titleEl = document.createElement('div');
        titleEl.className = 'tile-title';
        titleEl.textContent = item.name || 'Untitled App Clip';

        const subEl = document.createElement('div');
        subEl.className = 'tile-sub';
        subEl.textContent = destUrl || 'No URL set';

        info.appendChild(titleEl);
        info.appendChild(subEl);

        const arrow = document.createElement('div');
        arrow.className = 'tile-arrow';
        arrow.textContent = '›';

        tile.appendChild(info);
        tile.appendChild(arrow);

        tile.addEventListener('click', (e) => {
          e.preventDefault();
          if (!destUrl || destUrl === 'https://') {
            switchTab('edit');
            return;
          }
          // Open directly inside Aura Browser
          window.location.href = destUrl;
        });

        container.appendChild(tile);
      });
    }

    // --- TAB 2: RENDER EDITOR ---
    function renderEditor() {
      const container = document.getElementById('linksList');
      container.innerHTML = '';

      links.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-header">
            <div class="card-num">APP CLIP #${index + 1}</div>
            <div class="card-actions">
              <button class="btn-icon" type="button" onclick="moveLink(${index}, -1)" ${index === 0 ? 'disabled' : ''} title="Move Up">↑</button>
              <button class="btn-icon" type="button" onclick="moveLink(${index}, 1)" ${index === links.length - 1 ? 'disabled' : ''} title="Move Down">↓</button>
              <button class="btn-delete" type="button" onclick="removeLink(${index})">Delete</button>
            </div>
          </div>
          <label>App Clip Name</label>
          <input type="text" class="link-title" placeholder="e.g. Stopwatch" />
          <label>Target URL (Opens in Aura Browser)</label>
          <input type="url" class="link-url" placeholder="https://..." autocapitalize="off" autocorrect="off" spellcheck="false" />
        `;
        div.querySelector('.link-title').value = item.name || '';
        div.querySelector('.link-url').value = item.url || '';

        div.querySelectorAll('input').forEach(inp => {
          inp.addEventListener('input', () => {
            syncInputs();
            saveLocalCache();
          });
        });

        container.appendChild(div);
      });
    }

    function syncInputs() {
      const cards = document.querySelectorAll('#linksList .card');
      cards.forEach((card, i) => {
        if (links[i]) {
          links[i].name = card.querySelector('.link-title').value;
          links[i].url = card.querySelector('.link-url').value.trim();
        }
      });
    }

    function addLink() {
      syncInputs();
      links.push({
        name: 'New App Clip',
        url: 'https://',
        openInSafari: false
      });
      saveLocalCache();
      renderEditor();
    }

    function removeLink(index) {
      syncInputs();
      const toDel = links[index];
      if (toDel && toDel.url) addDeletedUrl(toDel.url);
      links.splice(index, 1);
      pushToCloud();
      renderEditor();
    }

    function moveLink(index, dir) {
      syncInputs();
      const targetIdx = index + dir;
      if (targetIdx < 0 || targetIdx >= links.length) return;
      const temp = links[index];
      links[index] = links[targetIdx];
      links[targetIdx] = temp;
      pushToCloud();
      renderEditor();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg || 'Saved & Synced!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    async function saveAndSwitch() {
      syncInputs();
      links.forEach(item => {
        if (item.url && item.url !== 'https://') {
          item.url = normalizeUrl(item.url);
        }
      });
      await pushToCloud();
      showToast('Saved & Synced!');
      renderLaunchTiles();
      document.getElementById('tabLaunchBtn').classList.add('active');
      document.getElementById('tabEditBtn').classList.remove('active');
      document.getElementById('paneLaunch').classList.add('active');
      document.getElementById('paneEdit').classList.remove('active');
    }

    // 1. Render immediately from local cache (0ms load)
    loadLocalCache();
    renderLaunchTiles();

    // 2. Sync with Render cloud in the background & when returning to the app
    pullFromCloud();
    window.addEventListener('focus', () => {
      if (!document.getElementById('paneEdit').classList.contains('active')) {
        pullFromCloud();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !document.getElementById('paneEdit').classList.contains('active')) {
        pullFromCloud();
      }
    });
    window.addEventListener('pageshow', () => {
      if (!document.getElementById('paneEdit').classList.contains('active')) {
        pullFromCloud();
      }
    });
  </script>
</body>
</html>
